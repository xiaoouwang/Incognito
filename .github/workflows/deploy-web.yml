name: Deploy web interface

on:
  # Runs only when web_interface/ or this workflow changes — not on every push to main.
  push:
    branches: [main]
    paths:
      - "web_interface/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous published tree (for /vX.Y.Z/ retention)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .previous-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web_interface/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web_interface

      - name: Build
        run: npm run build
        working-directory: web_interface
        env:
          # Optional override; default is ALBERT_CORS_PROXY_BASE_URL in albertConstants.js
          VITE_ALBERT_BASE_URL: ${{ vars.VITE_ALBERT_BASE_URL }}

      - name: Assemble latest + versioned snapshots
        run: node scripts/assembleVersionedPages.mjs --dist dist --out ../public --previous ../.previous-pages
        working-directory: web_interface

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Mirror assembled site to gh-pages (next deploy can keep old /v*)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: false
          commit_message: "Publish Incognito Web (versioned Pages tree)"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
